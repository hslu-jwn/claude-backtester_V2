[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "Rule-based price-action strategy backtester (FVG, order blocks, BOS, liquidity sweeps) with strict no-lookahead guarantees."
requires-python = ">=3.11"
dependencies = [
    "tzdata",  # IANA time zones for zoneinfo on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ui = ["dash>=2.17", "plotly>=5.22"]
risk = ["numpy>=1.26"]
data = ["pandas>=2.2", "pyarrow>=15"]
mt5 = ["MetaTrader5; platform_system == 'Windows'", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
