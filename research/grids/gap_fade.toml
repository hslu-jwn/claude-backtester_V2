# Old tool: gap_fade_grid.py
# Default command: python -m backtester.tools.gap_fade_grid
# not carried over: --start/--end (fixed development/test split),
# --source/--cache-dir (runner uses DEFAULT_SOURCES), --spread-table (no grid equivalent),
# --out/--family (runner controls results and trials). --workers remains a runner option.
# --no-sweep/--only/parameter CLI axes: edit grid settings instead.
# --no-shocks: set shocks = false; split-year overrides: runner scorecard halves.
# Walk-forward replaces gap_fade_walk_forward.py: set walk_forward = "anchored" above tables; Monte Carlo stays separate.
strategy = "gap_fade"
symbols = ["NAS100", "US500"]
max_variants = 10000

[[grids]]
name = "gap_0.1_0.25"
[grids.base]
"min_gap_atr" = 0.1
"max_gap_atr" = 0.25
[grids.grid]
"stop_gap_mult" = [0.75, 1.0, 1.5]
"exit_time" = ["11:00", "12:00", "16:00"]

[[grids]]
name = "gap_0.25_0.5"
[grids.base]
"min_gap_atr" = 0.25
"max_gap_atr" = 0.5
[grids.grid]
"stop_gap_mult" = [0.75, 1.0, 1.5]
"exit_time" = ["11:00", "12:00", "16:00"]

[[grids]]
name = "gap_0.5_1.0"
[grids.base]
"min_gap_atr" = 0.5
"max_gap_atr" = 1.0
[grids.grid]
"stop_gap_mult" = [0.75, 1.0, 1.5]
"exit_time" = ["11:00", "12:00", "16:00"]

[[grids]]
name = "gap_0.1_1.0"
[grids.base]
"min_gap_atr" = 0.1
"max_gap_atr" = 1.0
[grids.grid]
"stop_gap_mult" = [0.75, 1.0, 1.5]
"exit_time" = ["11:00", "12:00", "16:00"]
