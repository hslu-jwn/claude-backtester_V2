# F2L ROD momentum on large-move days (docs/strategy-timed-hold.md > Families, hypothesis 6).
# Pre-registered 2026-11-09 AFTER the F2 results (counted as a new hypothesis): Gao et al. (2018)
# and Baltussen et al. (2021) report stronger last-30-minute momentum on volatile / large-move
# days (gamma hedging scales with the move). One cell: min_move_atr 0.5, stop 0.5.
strategy = "timed_hold"
symbols = ["US500", "NAS100"]
monkeys = false
sensitivity = false
entry_screen = false
min_trades = 150

[base]
skip_nyse_short_days = true # the user 2026-11-09
zone = "America/New_York"
entry_time = "15:30"
exit_time = "16:00"
direction = "with_day"
atr_zone = "America/New_York"
atr_open = "09:30"
atr_close = "16:00"
day_filter = "all"
min_move_atr = 0.5

[grid]
stop_atr = [0.5]
