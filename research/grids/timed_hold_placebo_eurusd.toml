# PLACEBO / diagnostic for F1a (docs/strategy-timed-hold.md): EURUSD long, 6-hour holds starting
# every hour 00:00-17:00 London. Not a hypothesis and never a selection: it profiles the time-of-day
# shape that Breedon & Ranaldo predict (negative in European hours, positive in US hours). Short =
# the negative of long before costs. Counted in the trial log as its own family.
strategy = "timed_hold"
symbols = ["EURUSD"]
monkeys = false
sensitivity = false
entry_screen = false
min_trades = 300

[base]
zone = "Europe/London"
direction = "long"
stop_atr = 0.5
atr_zone = "UTC"
atr_open = "00:00"
atr_close = "23:59"
# ATR fix 2026-11-09 (code review): Fridays counted, Sunday stubs left out (run 1 had a ~8 % small ATR)
atr_close_tolerance_min = 180
atr_skip_weekend = true
day_filter = "all"

[[grids]]
name = "h00"
[grids.base]
entry_time = "00:00"
exit_time = "06:00"
[grids.grid]
direction = ["long"]

