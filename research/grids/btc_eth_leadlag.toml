# Strategy 16 btc_eth_leadlag (docs/strategy-btc_eth_leadlag.md). Pre-registered 2026-11-10, before any run.
# DO NOT RUN before multi-symbol step 1a (reference symbols, docs/design/multi-symbol.md > A) has landed:
# the strategy does not exist yet and the keys marked "proposed" below are not implemented. They are the
# spec's names; the implementer may rename them in the same commit as the spec.
# Source: Chernoff, BTC/ETH price discovery (MDPI 1911-8074/19/9/678); harvest idea 12.
# Data: ETHUSD MT5 2018-01-10..2021-09-13 (traded), BTCUSD MT5 2018-01-10..2021-09-13 (reference, read-only).
# Always --dev-only (before 2021-09-14).
strategy = "btc_eth_leadlag"
symbols = ["ETHUSD"]           # traded symbol; BTCUSD is reference, never traded.
monkeys = false
sensitivity = false
entry_screen = false
min_trades = 200

[base]
zone = "UTC"
active_from = "00:00"          # proposed: evaluate H1 closes 24/7 across all UTC hours
active_to = "23:00"
ref_symbol = "BTCUSD"          # proposed: read-only reference symbol
ref_timeframe = "H1"           # proposed: 1-hour return
signal_type = "pct_return"     # proposed: 100 * (C_t / C_{t-1} - 1)
stop_atr_period = 14
max_open_positions = 1         # one position at a time, no overlapping trades

# Family S: the signal rule. Primary cell: threshold 2.0 %, stop 1.5 ATR, hold 240 min.
[[grids]]
name = "S"
[grids.base]
direction = "with_ref"         # proposed: long if ref return >= +threshold, short if <= -threshold
[grids.grid]
min_ref_return_pct = [1.5, 2.0] # proposed: H1 return threshold in percent
stop_atr = [1.0, 1.5]
hold_minutes = [180, 240]      # 3 hours, 4 hours

# Family C: control, the same window on all days, fixed direction, no reference signal.
# The gates tool removes the signal-trade dates/times from these series (disjoint samples).
# Only the hold duration and the stop vary (the threshold has no meaning here).
[[grids]]
name = "C"
[grids.base]
min_ref_return_pct = 0.0
[grids.grid]
direction = ["long", "short"]
stop_atr = [1.0, 1.5]
hold_minutes = [180, 240]
