# Strategy 14 us_close_de_open (docs/strategy-us_close_de_open.md). Pre-registered 2026-11-10, before any run.
# Development only, --dev-only; gates tool pending (U4).
# Source: Xu et al., cross-market overnight time-series momentum (abstract only); harvest idea 10.
# Data: GER40 histdata 2015-01-02..2020-06-14 (INVALID_PERIODS cuts 2020-06-15), UK100 histdata 2015..2021,
# US500 (reference, read-only) histdata 2015.. . Always --dev-only (before 2021-09-14).
strategy = "us_close_de_open"
symbols = ["GER40"] # traded symbol; UK100 breadth has its own grid (S14). US500 is never traded.
monkeys = false
sensitivity = false
entry_screen = false
min_trades = 200

[base]
zone = "Europe/Berlin"
entry_time = "09:00"           # close of the 09:00 Berlin candle
ref_symbol = "US500"           # optional reference (U2); both exact signal candles required (G5)
ref_zone = "America/New_York"
ref_from = "15:30"             # close of the candle closing 15:30 ...
ref_to = "16:00"               # ... to close of the candle closing 16:00 on the previous weekday
skip_nyse_short_days = true    # signal day and trade day must be full NYSE sessions
atr_zone = "Europe/Berlin"
atr_open = "09:00"
atr_close = "17:30"
atr_period = 14

# Family S: the signal rule. Primary cell: threshold 0.10, stop 0.5, exit 09:30.
[[grids]]
name = "S"
[grids.base]
direction = "with_ref"         # long if ref return >= +threshold, short if <= -threshold
[grids.grid]
min_ref_return_pct = [0.10, 0.20]
stop_atr = [0.5, 1.0]
exit_time = ["09:30", "10:00"]

# Family C: control, the same window on qualifying full NYSE days (U1), fixed direction,
# no reference signal candles required.
# The gates tool removes the signal-trade dates from these series (disjoint samples).
# Only the exit time and the stop vary (the threshold has no meaning here).
[[grids]]
name = "C"
[grids.base]
min_ref_return_pct = 0.0
[grids.grid]
direction = ["long", "short"]
stop_atr = [0.5, 1.0]
exit_time = ["09:30", "10:00"]

# Breadth symbol UK100: entry 08:00 London (its cash open), exit 30 / 60 minutes later, same US500 signal.
# Run the S and C families in us_close_de_open_uk.toml (S14) with these overrides:
#   zone = "Europe/London", entry_time = "08:00", exit_time = "08:30" / "09:00",
#   atr_zone = "Europe/London", atr_open = "08:00", atr_close = "16:30"
# Only the primary cell (0.10 %, 0.5 ATR, +30 min) is a breadth gate; the other UK100 cells are reported.

[gates]
symbol = "GER40"
min_trades = 200
halves = "2017-10-08"
primary = { family = "S", min_ref_return_pct = 0.10, stop_atr = 0.5, exit_time = "09:30" }
integrity_max_gap = 5

[gates.control]
family = "C"
match = ["stop_atr", "exit_time"]

[gates.breadth]
primary = { family = "S", min_ref_return_pct = 0.10, stop_atr = 0.5, exit_time = "08:30" }
symbol = "UK100"
