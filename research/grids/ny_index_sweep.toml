# Old tool: strategy2_sweep_grid.py
# Default command: python -m backtester.tools.strategy2_sweep_grid
# not carried over: --start/--end (fixed development/test split),
# --source/--cache-dir (runner uses DEFAULT_SOURCES), --spread-table (no grid equivalent),
# --out/--family (runner controls results and trials). --workers remains a runner option.
# --no-sweep/--only/parameter CLI axes: edit grid settings instead.
# --no-shocks: set shocks = false; split-year overrides: runner scorecard halves.
strategy = "ny_index_sweep"
symbols = ["NAS100", "US500"]
max_variants = 10000

[[grids]]
name = "base"
[grids.base]
[grids.grid]

[[grids]]
name = "strict (max of N)"
[grids.base]
"sweep_equal_highs" = true
[grids.grid]

[[grids]]
name = "tol 0.5 ATR"
[grids.base]
"sweep_equal_highs" = true
"sweep_equal_tolerance_atr" = 0.5
[grids.grid]

[[grids]]
name = "breakout 2 closes"
[grids.base]
"sweep_breakout_closes" = 2
[grids.grid]

[[grids]]
name = "breakout wick+close"
[grids.base]
"sweep_breakout_closes" = 2
"sweep_breakout_wick_first" = true
[grids.grid]

[[grids]]
name = "BoS before top"
[grids.base]
"bos_before_top" = true
[grids.grid]

[[grids]]
name = "tol 0.5 + wick+close"
[grids.base]
"sweep_equal_highs" = true
"sweep_equal_tolerance_atr" = 0.5
"sweep_breakout_closes" = 2
"sweep_breakout_wick_first" = true
[grids.grid]

[[grids]]
name = "tol 0.5 + wick+close + BoS before top"
[grids.base]
"sweep_equal_highs" = true
"sweep_equal_tolerance_atr" = 0.5
"sweep_breakout_closes" = 2
"sweep_breakout_wick_first" = true
"bos_before_top" = true
[grids.grid]
